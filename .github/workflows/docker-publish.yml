name: Build and Publish Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: DCC-BS/ci-workflows/.github/workflows/publish-docker.yml@v9
    secrets: inherit
    with:
      project_type: "python"
      registry: ghcr.io
      image_name: ghcr.io/dcc-bs/datenkatalog-attribute-extractor
      context: .
      dockerfile: ./Dockerfile
      platforms: linux/amd64
      push: true
