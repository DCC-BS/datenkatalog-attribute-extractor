# Firecrawl, for extracting form fields from web pages.
#
# Adapted from https://github.com/DCC-BS/firecrawl-test with these deliberate changes:
#
#   * Prebuilt images instead of `build: apps/...`. Upstream builds from the Firecrawl
#     source tree, which we do not vendor. Only the api image publishes semver tags; the
#     playwright and postgres images publish nothing but `latest`, so those float.
#   * searxng dropped. It backs Firecrawl's /search endpoint, which we never call — we only
#     scrape a single URL. It also wants a ./searxng config directory we would have to invent.
#   * Service names namespaced with a `firecrawl-` prefix, so `redis` and `api` cannot
#     collide with anything in our own stack, and the internal URLs below follow.
#   * The upstream `backend` network is gone. Every service here joins the compose project's
#     network alongside app-backend, which is what lets the backend reach firecrawl-api by
#     name without publishing a host port.
#   * The unused environment variables are dropped: OpenAI, Supabase, Autumn, Slack, proxy
#     and searxng settings were all `${VAR}` with no default, so they resolved to empty
#     anyway. Auth is off (USE_DB_AUTHENTICATION=false) and stays off by decision, so no API
#     key is configured and the backend sends no Authorization header.
#
# Resource reservations are upstream's. They are generous — 8G for the api, 4G for the
# browser pool — but this box has 96G, so they are left alone.
#
# In production this file is not used at all: FIRECRAWL_API_URL points at the cluster
# deployment and nothing here starts.

services:
  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:2.10.19
    command: node dist/src/harness.js --start-docker
    environment:
      HOST: "0.0.0.0"
      PORT: 3002
      EXTRACT_WORKER_PORT: 3004
      WORKER_PORT: 3005
      ENV: local
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB:-postgres}
      USE_DB_AUTHENTICATION: "false"
      NUM_WORKERS_PER_QUEUE: ${FIRECRAWL_WORKERS_PER_QUEUE:-8}
      CRAWL_CONCURRENT_REQUESTS: ${FIRECRAWL_CONCURRENT_REQUESTS:-10}
      MAX_CONCURRENT_JOBS: ${FIRECRAWL_MAX_CONCURRENT_JOBS:-5}
      BROWSER_POOL_SIZE: ${FIRECRAWL_BROWSER_POOL_SIZE:-5}
      LOGGING_LEVEL: ${FIRECRAWL_LOGGING_LEVEL:-INFO}
    depends_on:
      firecrawl-redis:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: ${FIRECRAWL_CONCURRENT_REQUESTS:-10}
      # BLOCK_MEDIA would speed scrapes up, but the screenshot strategy and the UI comparison
      # pane both need screenshots that match the rendered page. Left off until measured.
      # BLOCK_MEDIA: "true"
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  firecrawl-redis:
    image: redis:alpine
    command: redis-server --bind 0.0.0.0
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    environment:
      POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB:-postgres}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
