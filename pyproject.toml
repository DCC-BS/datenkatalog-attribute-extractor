[project]
name = "datenkatalog-attribute-extractor"
version = "0.1.0"
description = "Extract uniquely named form fields from questionnaires using a local vision LLM."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.14.2",
    "dcc-backend-common[fastapi,pydantic-ai]>=0.1.18",
    "dependency-injector>=4.48.3",
    "fastapi[standard]>=0.136.0",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pydantic>=2.12.5",
    "pydantic-ai>=2.0.0",
    "pypdfium2>=5.12.1",
    "returns>=0.26.0",
    "streamlit>=1.60.0",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    # pypdf is only used by the eval harness, to read AcroForm ground truth.
    "pypdf>=6.1.3",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.13",
    "ty>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datenkatalog_attribute_extractor"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { dcc-backend-common = "P1D" }
