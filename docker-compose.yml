networks:
  app-network:
    driver: bridge

services:
  llm:
    extends:
      file: ./docker/services.compose.yml
      service: llm
    restart: unless-stopped
    networks:
      - app-network

  app-backend:
    extends:
      file: ./docker/services.compose.yml
      service: app-backend
    restart: unless-stopped
    networks:
      - app-network

  app-frontend:
    extends:
      file: ./docker/services.compose.yml
      service: app-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    networks:
      - app-network
