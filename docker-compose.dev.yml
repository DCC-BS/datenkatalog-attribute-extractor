services:
  llm:
    extends:
      file: ./docker/services.compose.yml
      service: llm
    ports:
      - "${LLM_API_PORT:-8001}:8000"

  app-backend:
    extends:
      file: ./docker/services.compose.yml
      service: app-backend
    environment:
      - IS_PROD=false
      - LOG_LEVEL=DEBUG
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro

  app-frontend:
    extends:
      file: ./docker/services.compose.yml
      service: app-frontend
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    volumes:
      - ./src:/app/src:ro
