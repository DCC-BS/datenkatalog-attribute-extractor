services:
  llm:
    extends:
      file: ./docker/services.compose.yml
      service: llm
    ports:
      - "${LLM_API_PORT:-8001}:8000"

  # PYTHONPATH puts the mounted source ahead of the copy installed into the venv. Without it
  # the bind mount only replaces the entrypoint script while every import still resolves to
  # the image's build, which silently mixes new code with old.
  app-backend:
    extends:
      file: ./docker/services.compose.yml
      service: app-backend
    environment:
      - IS_PROD=false
      - LOG_LEVEL=DEBUG
      - PYTHONPATH=/app/src
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro

  app-frontend:
    extends:
      file: ./docker/services.compose.yml
      service: app-frontend
    environment:
      - PYTHONPATH=/app/src
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    volumes:
      - ./src:/app/src:ro

  # The browser sits behind the `web` profile, so `make docker-up` still starts only vLLM, the
  # API and the UI. `make docker-up-web` adds this one container — it replaced the five
  # Firecrawl needed. `profiles` has to be declared here rather than in the extended file,
  # because `extends` does not carry it.
  browser:
    extends:
      file: ./docker/services.compose.yml
      service: browser
    profiles: ["web"]
    ports:
      - "${BROWSER_PORT:-3100}:3100"
